name: Test Audit
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check for tests
        run: |
          make test
